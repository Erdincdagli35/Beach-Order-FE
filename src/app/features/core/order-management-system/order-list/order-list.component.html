<div class="container p-3">

  <!-- Başlık + Hata Mesajı -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Orders</h2>
    <button class="btn btn-primary" (click)="loadOrders()">Yenile</button>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <!-- Sipariş Listesi -->
  <div *ngIf="orders?.length; else emptyBlock">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Status</th>
          <th>Total</th>
          <th>Created At</th>
          <th>Bills (Piece / Product Number)</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let o of orders">
          <td>{{ o.id }}</td>
          <td>{{ o.status }}</td>
          <td>{{ o.total }}</td>
          <td>{{ o.createdAt | date:'short' }}</td>

          <td>
            <ul class="mb-0 ps-3">
              <li *ngFor="let b of o.bills">
                Piece: {{ b.piece }} |
                Product Name: {{ b.productName }}
              </li>
            </ul>
          </td>

        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #emptyBlock>
    <div class="alert alert-info">Henüz sipariş yok.</div>
  </ng-template>

</div>
