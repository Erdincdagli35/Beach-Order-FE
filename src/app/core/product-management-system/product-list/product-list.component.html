<div class="container product-page">

  <h3 class="mb-3 fw-bold text-primary">Product List</h3>
  <!-- Kategori Tab Bar -->
  <div class="category-tabs mb-4" *ngIf="categories?.length">
    <button
      *ngFor="let c of categories"
      class="category-tab"
      [class.active]="selectedCategory === c"
      (click)="selectedCategory = c">
      {{ c }}
    </button>
  </div>

  <!-- Admin: Yeni Ürün Ekle -->
   <div class="action-buttons d-flex justify-content-end gap-2">
    <button class="btn btn-primary" (click)="onCreate()">
      <span class="btn-icon" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <span class="btn-text">{{ showCreateForm ? 'Cancel' : 'New Product Add' }}</span>
    </button>

    <button class="btn btn-primary" (click)="router.navigate(['order-create'])">
      <span class="btn-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path d="M3 3h2l.4 2M7 13h10l3-8H6.4" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="10" cy="20" r="1" fill="currentColor" />
          <circle cx="18" cy="20" r="1" fill="currentColor" />
        </svg>
      </span>
      <span class="btn-text">View the Cart</span>
    </button>
  </div>


  <!-- Create Form -->
  <div *ngIf="showCreateForm && token.hasRole('ROLE_ADMIN')" class="product-form card p-3 shadow-sm mb-4">
    <form #productForm="ngForm" novalidate>
      <div class="row g-3">
        <div class="col-md-4">
          <input class="form-control" name="name" placeholder="Product Name" required
                 [(ngModel)]="newProduct.name" #nameCtrl="ngModel" />
        </div>
        <div class="col-md-4">
          <input class="form-control" name="price" type="number" min="0" step="0.01"
                 placeholder="Fiyat" required [(ngModel)]="newProduct.price" />
        </div>
        <div class="col-md-4">
          <input class="form-control" name="description" placeholder="Description" required
                 [(ngModel)]="newProduct.description"/>
        </div>
        <div class="col-md-3">
          <select class="form-select" name="category" required [(ngModel)]="newProduct.category">
            <option *ngFor="let c of categories" [ngValue]="c">{{ c }}</option>
          </select>
        </div>
        <div class="col-md-1">
          <button class="btn btn-success w-100" type="submit" [disabled]="productForm.invalid">Submit</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Ürün Listesi -->
  <div *ngIf="selectedCategory && groupedProducts[selectedCategory]?.length" class="row g-3">
    <div class="col-md-4" *ngFor="let p of groupedProducts[selectedCategory]">
      <div class="product-card shadow-sm p-3">
        <h6 class="mb-1">{{ p.name }}</h6>
        <div class="text-muted small mb-2">💰 {{ p.price | currency:'TRY ':'symbol':'1.2-2' }}</div>
        <label class="mb-1">{{ p.description }}</label>

        <div class="d-flex justify-content-end gap-2">
          <button class="btn btn-outline-primary btn-sm"  (click)="onEdit(p.id)">Edit</button>
          <button class="btn btn-outline-danger btn-sm"  (click)="onDelete(p.id)">Delete</button>
          <button class="btn btn-outline-danger btn-sm" (click)="onAddToCart(p)">Add to Cart</button>        
       </div>
      </div>
    </div>
  </div>

  <div *ngIf="selectedCategory && (!groupedProducts[selectedCategory] || !groupedProducts[selectedCategory].length)"
       class="text-muted text-center mt-5">
    None product find by this category
  </div>

</div>
