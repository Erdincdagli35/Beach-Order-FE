<div class="menu-container">

  <div class="logo-wrapper">
    <img src="assets/logo.svg" alt="Logo" />
  </div>

  <h1 class="menu-title">Ürün Menüsü</h1>

  <!-- CATEGORY -->
  <nav class="category-nav" *ngIf="categories?.length">
    <button 
      *ngFor="let c of categories"
      (click)="selectedCategory = c"
      [class.active]="selectedCategory === c"
    >
      {{ c }}
    </button>

    <!-- ADMIN CREATE -->
  <div class="action-buttons d-flex justify-content-end gap-2">
    <button class="btn btn-primary" (click)="router.navigate(['order-create'])">
      <span class="btn-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path d="M3 3h2l.4 2M7 13h10l3-8H6.4" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="10" cy="20" r="1" fill="currentColor" />
          <circle cx="18" cy="20" r="1" fill="currentColor" />
        </svg>
      </span>
      <span class="btn-text">Sepeti Görüntüle</span>
    </button>
  </div>
  
  </nav>

  <!-- TABLE -->
  <div class="table-wrapper" *ngIf="selectedCategory">

    <table>
      <tbody>
        <tr *ngFor="let p of groupedProducts[selectedCategory]">

          <td class="item-name">
            {{ p.name }}
            <div class="item-description">
              {{ p.description }}
            </div>
          </td>

          <td class="item-price">
            {{ p.price | number:'1.0-0' }} ₺
          </td>

          <!-- ✅ ADMIN ACTIONS -->
          <td class="item-actions">
            <br>
            <button class="btn-icon edit" (click)="onAddToCart(p)">Ürün Ekle</button>
          </td>

        </tr>
      </tbody>
    </table>

    <div *ngIf="!groupedProducts[selectedCategory]?.length" class="no-items">
      Bu kategoride ürün bulunmamaktadır.
    </div>

  </div>
</div>
